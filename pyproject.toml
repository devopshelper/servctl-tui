[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "servctl"
version = "0.1.0"
description = "TUI control plane for routine Linux server administration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["textual>=1.0,<9"]

[project.scripts]
servctl = "servctl.__main__:main"

[tool.setuptools]
packages = ["servctl"]
