[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "servctl"
version = "0.4.3"
description = "TUI control plane for routine Linux server administration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["textual>=8.0,<9", "dnspython>=2.2", "PyYAML>=5.4"]

[project.scripts]
servctl = "servctl.__main__:main"

[tool.setuptools.packages.find]
include = ["servctl*"]
